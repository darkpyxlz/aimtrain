<title>Aimtrain</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* single deliberate look: white ground, black ink (requested) */
:root{--bg:#fff;--fg:#000;color-scheme:light}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px ui-monospace,Menlo,Consolas,monospace;overflow:hidden;user-select:none}
canvas{display:block;cursor:crosshair}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));pointer-events:none;white-space:pre;font-variant-numeric:tabular-nums}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px}
#menu[hidden]{display:none}
#box{border:2px solid var(--fg);padding:20px;background:var(--bg);white-space:pre;line-height:1.6;font-variant-numeric:tabular-nums;max-width:100%;max-height:100%;overflow:auto;box-sizing:border-box}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
button,select{font:inherit;color:var(--fg);background:var(--bg);border:2px solid var(--fg);padding:4px 10px;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
</style>
<canvas id="c"></canvas><div id="hud"></div>
<div id="menu"><div id="box"><div id="res"></div>
<div class="row">mode <select id="mode"><option value="aim">aim</option><option value="mania">mania 4k</option><option value="taiko">taiko</option></select>
 time <select id="dur"><option value="30">30s</option><option value="60">60s</option><option value="0">unlimited</option></select></div>
<div class="row">difficulty <select id="diff"><option value="custom">custom</option><option value="easy">easy</option><option value="normal">normal</option><option value="hard">hard</option><option value="insane">insane</option><option value="expert">expert</option><option value="adapt">adaptive</option></select>
 trail <select id="trail"><option value="1">on</option><option value="0">off</option></select></div>
<div class="row">bpm <select id="bpm"><option>90</option><option selected>120</option><option>150</option><option>180</option><option>210</option><option>240</option></select>
 music <select id="vol"><option value="0">off</option><option value="0.2">low</option><option value="0.45" selected>mid</option><option value="0.8">high</option></select></div>
<div class="row" id="aimopt">size <select id="sz"><option value="1">normal</option><option value="0.7">small</option><option value="1.4">large</option></select>
 approach <select id="pre"><option value="1200">slow</option><option value="900" selected>normal</option><option value="600">fast</option><option value="450">very fast</option></select>
 pattern <select id="pat"><option value="mix">mixed</option><option value="jump">jumps</option><option value="stream">streams</option><option value="double">doubles</option><option value="sc">circle + slider</option><option value="stack">stacks</option><option value="tri">triangles</option><option value="back">back and forth</option></select></div>
<div class="row" id="tkopt" hidden>pattern <select id="tpat"><option value="mix">mixed</option><option value="alt">alternating dkdk</option><option value="tri">triplets ddk / kkd</option><option value="burst">1/4 bursts (5)</option><option value="fc">finger control</option><option value="stream">1/4 streams</option><option value="mono">mono don/kat runs</option></select></div>
<div class="row" id="manopt" hidden><span id="msnapw">snap <select id="msnap"><option value="1">1/1</option><option value="2" selected>1/2</option><option value="4">1/4</option></select></span>
 scroll <select id="spd"><option value="0.8">slow</option><option value="1.2" selected>normal</option><option value="1.8">fast</option></select></div>
<div class="row"><button id="go">start (space)</button></div>
<div id="help"></div></div></div>
<script>
const $=id=>document.getElementById(id),c=$('c'),cx=c.getContext('2d'),hud=$('hud'),menu=$('menu');
let W,H;function rs(){W=c.width=innerWidth;H=c.height=innerHeight}onresize=rs;rs();
const ls={get(k){try{return +localStorage[k]||0}catch(e){return 0}},set(k,v){try{localStorage[k]=v}catch(e){}}};
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:0,sd=a=>{const m=avg(a);return Math.sqrt(avg(a.map(v=>(v-m)**2)))};
const hyp=Math.hypot,PI2=Math.PI*2,F='ui-monospace,Menlo,monospace';
let st=null;
// ---------- audio: synthesized loop locked to bpm ----------
let ac,master,nb;
function audio(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.connect(ac.destination)}ac.resume();master.gain.value=+$('vol').value}catch(e){ac=null}}
function tone(t,f,d,type,g,f2){const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(master);o.start(t);o.stop(t+d+.02)}
function noise(t,d,g,hp){if(!nb){nb=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const s=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=hp;
 v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(v);v.connect(master);s.start(t);s.stop(t+d+.02)}
const PROG=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],mf=n=>440*2**((n-69)/12);
function beat(b,t,bl){if(b<0){tone(t,b==-4?1320:880,.06,'square',.12);return}
 const ch=PROG[(b>>2)%4];tone(t,150,.3,'sine',.9,40);noise(t+bl/2,.05,.22,7000);if(b%2)noise(t,.12,.18,2500);
 tone(t,mf(ch[0]-12),bl*.9,'triangle',.4);tone(t+bl/2,mf(ch[0]-12),bl*.4,'triangle',.25);
 tone(t,mf(ch[b%3]+12),bl*.45,'square',.035);tone(t+bl/2,mf(ch[(b+1)%3]+12),bl*.45,'square',.03)}
function hitSound(){if(ac&&master.gain.value)noise(ac.currentTime,.03,.5,3000)}
function sched(now){if(!ac||!master.gain.value)return;while(st.ab*st.bl<now+200){const tt=st.ab*st.bl;if(tt>now-30)beat(st.ab,ac.currentTime+Math.max(0,(tt-now)/1000),st.bl/1000);st.ab++}}
// ---------- menu ----------
function help(){const m=$('mode').value;$('aimopt').hidden=m!='aim';$('manopt').hidden=m=='aim';$('tkopt').hidden=m!='taiko';$('msnapw').hidden=m=='taiko';
 $('help').textContent=m=='aim'?'hit circles on the beat (click, or hover + z/x)\nsliders: hold and follow the ball, arrows = bounce back\nspinners: hold and spin around the center\nesc ends the round':m=='mania'?'press d f j k as notes reach the line, on the beat\nlong notes: hold until the tail reaches the line\nesc ends the round':'filled = don: f or j   ring = kat: d or k\nhit when the note reaches the left circle\nlong bars = drumroll: hit either key as fast as you can\nesc ends the round'}
$('mode').onchange=help;
const PRE={easy:[90,1.4,1200,'1',0.8,'jump',.7],normal:[120,1,900,'2',1.2,'mix',1],hard:[150,1,600,'2',1.2,'mix',1.2],insane:[180,.85,450,'4',1.8,'mix',1.4],expert:[210,.7,450,'4',1.8,'mix',1.6]};
$('diff').onchange=()=>{const d=PRE[$('diff').value];if(!d)return;[$('bpm').value,$('sz').value,$('pre').value,$('msnap').value,$('spd').value,$('pat').value]=d.slice(0,6).map(String)};
function adapt(ok){if(!st.ad)return;st.rec.push(ok?1:0);if(st.rec.length<16)return;const a=avg(st.rec);st.rec=[];
 if(a>=.93)st.lvl=Math.min(10,st.lvl+1);else if(a<.78)st.lvl=Math.max(1,st.lvl-1);st.lmax=Math.max(st.lmax,st.lvl);setLvl()}
function setLvl(){const L=st.lvl;st.sp=.55+.12*L;if(st.m=='aim')st.pre=Math.max(380,st.pre0-55*(L-3));st.dens=Math.min(1,.45+.07*L)}$('go').onclick=start;
function show(t){$('res').textContent=t;menu.hidden=false;help()}
function start(){audio();const m=$('mode').value,bl=60000/+$('bpm').value;menu.hidden=true;
 const dd=PRE[$('diff').value];st={m,bl,ad:$('diff').value=='adapt',lvl:3,lmax:3,rec:[],sp:dd?dd[6]:1,dens:1,trail:+$('trail').value,tr:[],bpm:+$('bpm').value,start:performance.now()+4*bl,dur:+$('dur').value*1000,ab:-4,pops:[],combo:0,maxc:0,errs:[]};
 if(m=='aim')Object.assign(st,{r:36*$('sz').value,pre:+$('pre').value,pre0:+$('pre').value,pat:$('pat').value,objs:[],nextT:0,lx:W/2,ly:H/2,j:[0,0,0,0],score:0,off:[],track:[],spins:[],mis:0,down:0,mx:W/2,my:H/2});
 else if(m=='taiko')Object.assign(st,{tpat:$('tpat').value,spd:+$('spd').value*.8,notes:[],next:0,j:[0,0,0],held:[0,0,0,0],last:null,typ:[[0,0],[0,0]],rolls:0,rollMs:0})
 else Object.assign(st,{snap:+$('msnap').value,spd:+$('spd').value,notes:[],next:0,j:[0,0,0,0,0],held:[0,0,0,0],lastLane:-1,last:null,busy:[-1e9,-1e9,-1e9,-1e9],hold:[null,null,null,null],ht:[0,0]});if(st.ad)setLvl()}
// ---------- aim (osu-style) ----------
const AW=[50,100,150];
const clx=v=>Math.min(W-st.r-10,Math.max(st.r+10,v)),cly=v=>Math.min(H-st.r-10,Math.max(st.r+50,v));
function near(a,b,from){const ang=(from??Math.random()*PI2),d=st.r*(a+Math.random()*(b-a))*(a>2?st.sp:1);return[clx(st.lx+Math.cos(ang)*d),cly(st.ly+Math.sin(ang)*d)]}
function C(T,p){st.objs.push({k:'c',T,x:p[0],y:p[1]});st.lx=p[0];st.ly=p[1]}
function S(T,p,ang,L,span,reps){L*=st.sp;const x1=clx(p[0]+Math.cos(ang)*L),y1=cly(p[1]+Math.sin(ang)*L),E=T+span*(reps+1),
 bend=Math.random()<.65?(Math.random()-.5)*1.6:0,qx=clx((p[0]+x1)/2-(y1-p[1])*bend*.5),qy=cly((p[1]+y1)/2+(x1-p[0])*bend*.5),o={k:'l',T,E,x:p[0],y:p[1],x1,y1,qx,qy,span,reps,tr:0,tot:0};
 o.lut=[];let len=0,px=o.x,py=o.y;for(let i=0;i<=40;i++){const[a,b]=bz(o,i/40);len+=hyp(a-px,b-py);o.lut.push([len,a,b]);px=a;py=b}
 st.objs.push(o);const ev=reps%2==0;st.lx=ev?x1:p[0];st.ly=ev?y1:p[1];return E}
function chunk(T){const b=st.bl,h=b/2,r=st.r,R=Math.random,pats=['jump','stream','double','sc','stack','tri','back','slider'];
 let P=st.pat=='mix'?pats[R()*pats.length|0]:st.pat;
 if(st.pat=='mix'&&R()<.08&&T>b*4&&(!st.dur||T+b*5<st.dur)){const E=T+b*4;st.objs.push({k:'s',T,E,x:W/2,y:H/2,rot:0,pa:null});st.lx=W/2;st.ly=H/2;return E+b}
 if(P=='jump'){let a=R()*PI2;for(let i=0;i<4+(R()*5|0);i++){C(T,near(5,7,a));a+=Math.PI*(.6+R()*.8);T+=b}return T}
 if(P=='stream'){let a=R()*PI2;for(let i=0;i<8+(R()*9|0);i++){C(T,near(.9,1.3,a));a+=(R()-.5)*.7;if(st.lx<r*3||st.lx>W-r*3||st.ly<r*3+50||st.ly>H-r*3)a+=Math.PI;T+=h}return T+h}
 if(P=='double'){for(let i=0;i<3+(R()*3|0);i++){C(T,near(4,6));const a=R()*PI2;C(T+h,near(1.4,1.8,a));T+=b*1.5}return T+h}
 if(P=='sc'){for(let i=0;i<2+(R()*2|0);i++){if(R()<.5){C(T,near(3,5));const a=R()*PI2;const p=near(1.5,2,a);T=S(T+h,p,a+(R()-.5),r*(3+R()*2),b,0)+h;C(T,near(1.5,2.2))}
  else{const p=near(3,5);T=S(T,p,R()*PI2,r*(3+R()*2),b,R()<.5?1:0)+h;st.lx=p[0];st.ly=p[1];C(T,near(1.5,2))}T+=b}return T}
 if(P=='stack'){for(let i=0;i<2+(R()*3|0);i++){const p=near(4,6);for(let k=0;k<3;k++)C(T+k*h,p);T+=b*2}return T}
 if(P=='tri'){for(let i=0;i<3;i++){const p=near(4,6),a=R()*PI2,s=r*2.2;for(let k=0;k<3;k++)C(T+k*h,[clx(p[0]+Math.cos(a+k*2.094)*s),cly(p[1]+Math.sin(a+k*2.094)*s)]);T+=b*2}return T}
 if(P=='back'){const p0=near(3,4),p1=near(4,6);for(let i=0;i<6;i++){C(T,i%2?p1:p0);T+=h*(st.bpm>170?2:1)}return T+h}
 {const p=near(3,5);return S(T,p,R()*PI2,r*(3+R()*3),R()<.5?h:b,R()<.45?1+(R()*2|0):0)+b}}
function gen(now){while(st.nextT<now+st.pre+200&&(!st.dur||st.nextT<st.dur-300))st.nextT=chunk(st.nextT)}
function award(v,x,y){adapt(v>=100);st.j[[300,100,50,0].indexOf(v)]++;if(v){st.combo++;st.maxc=Math.max(st.maxc,st.combo);st.score+=Math.round(v*(1+st.combo/25));hitSound()}else st.combo=0;st.pops.push({x,y,v,t:performance.now()})}
const grade=e=>{const a=Math.abs(e);return a<=AW[0]?300:a<=AW[1]?100:a<=AW[2]?50:0};
function press(now){st.down++;const o=st.objs.find(o=>!o.hd&&o.k!='s');if(!o)return;
 const d=hyp(st.mx-o.x,st.my-o.y),e=now-o.T;if(d>st.r||e<-400){if(d>st.r)st.mis++;return}
 o.hd=1;const v=grade(e);st.errs.push(e);st.off.push(d/st.r);
 if(o.k=='c'){o.done=1;award(v,o.x,o.y)}else{o.hv=v;if(v)hitSound()}}
function bz(o,t){const u=1-t;return[u*u*o.x+2*u*t*o.qx+t*t*o.x1,u*u*o.y+2*u*t*o.qy+t*t*o.y1]}
function at(o,f){const L=o.lut,tg=f*L[40][0];let i=1;while(i<40&&L[i][0]<tg)i++;const a=L[i-1],b=L[i],k=(tg-a[0])/Math.max(b[0]-a[0],1e-6);return[a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k]}
function ball(o,now){let p=Math.max(0,Math.min(o.reps+1,(now-o.T)/o.span));let s=Math.floor(p),f=p-s;if(s>o.reps){s=o.reps;f=1}if(s%2)f=1-f;return[...at(o,f),s]}
function update(now){for(const o of st.objs){
 if(o.k=='c'&&!o.hd&&now>o.T+AW[2]){o.hd=o.done=1;award(0,o.x,o.y)}
 if(o.k=='l'){if(!o.hd&&now>o.T+AW[2]){o.hd=1;o.hv=0;st.combo=0}
  if(now>=o.T&&now<o.E){const[bx,by]=ball(o,now);o.tot++;if(st.down&&hyp(st.mx-bx,st.my-by)<=st.r*2.4)o.tr++}
  if(now>=o.E&&!o.done){o.done=1;const q=o.tr/Math.max(o.tot,1),h=o.hv||0;st.track.push(q);const[bx,by]=ball(o,o.E);
   award(q>=.9?(h||100):q>=.5?(h?Math.min(h,100):50):(h?50:0),bx,by)}}
 if(o.k=='s'){if(now>=o.T&&now<o.E&&st.down){const a=Math.atan2(st.my-o.y,st.mx-o.x);if(o.pa!=null){let d=a-o.pa;d-=PI2*Math.round(d/PI2);o.rot+=d}o.pa=a}else o.pa=null;
  if(now>=o.E&&!o.done){o.done=o.hd=1;const n=Math.abs(o.rot)/PI2,need=(o.E-o.T)/1000*1.5,q=n/need;st.spins.push(n/((o.E-o.T)/60000));award(q>=1?300:q>=.6?100:q>=.3?50:0,o.x,o.y)}}}
 st.objs=st.objs.filter(o=>!o.done)}
function circ(x,y,r,al){cx.globalAlpha=al;cx.lineWidth=4;cx.fillStyle='#fff';cx.strokeStyle='#000';cx.beginPath();cx.arc(x,y,r,0,PI2);cx.fill();cx.stroke();cx.fillStyle='#000';cx.beginPath();cx.arc(x,y,2,0,PI2);cx.fill()}
function ring(x,y,r,k,al){if(k<=0)return;cx.globalAlpha=al;cx.lineWidth=2;cx.beginPath();cx.arc(x,y,r*(1+3*k),0,PI2);cx.stroke()}
function arrow(x,y,tx,ty,r){const a=Math.atan2(ty-y,tx-x);cx.save();cx.translate(x,y);cx.rotate(a);cx.fillStyle='#000';cx.beginPath();cx.moveTo(r*.5,0);cx.lineTo(-r*.3,-r*.4);cx.lineTo(-r*.3,r*.4);cx.fill();cx.restore()}
function aimDraw(now,t){gen(now);update(now);const r=st.r;
 for(let i=st.objs.length-1;i>=0;i--){const o=st.objs[i];if(now<o.T-st.pre)continue;
  const al=Math.min(1,(now-o.T+st.pre)/(st.pre*.4)),k=(o.T-now)/st.pre;
  if(o.k=='c'){circ(o.x,o.y,r,al);ring(o.x,o.y,r,k,al)}
  else if(o.k=='l'){cx.globalAlpha=al;cx.lineCap='round';cx.strokeStyle='#000';cx.lineWidth=2*r+4;cx.beginPath();cx.moveTo(o.x,o.y);cx.quadraticCurveTo(o.qx,o.qy,o.x1,o.y1);cx.stroke();
   cx.strokeStyle='#fff';cx.lineWidth=2*r-4;cx.stroke();cx.strokeStyle='#000';cx.lineWidth=2;
   for(const[px,py]of[[o.x,o.y],[o.x1,o.y1]]){cx.beginPath();cx.arc(px,py,r,0,PI2);cx.stroke()}
   const[bx,by,s]=ball(o,now),left=o.reps-s;
   if(left>0){const e=at(o,.97),h0=at(o,.03);if(s%2)arrow(o.x,o.y,h0[0],h0[1],r);else arrow(o.x1,o.y1,e[0],e[1],r)}
   if(!o.hd){circ(o.x,o.y,r,al);ring(o.x,o.y,r,k,al)}
   if(now>=o.T){cx.globalAlpha=1;cx.fillStyle='#000';cx.beginPath();cx.arc(bx,by,r*.55,0,PI2);cx.fill();
    if(st.down&&hyp(st.mx-bx,st.my-by)<=r*2.4){cx.lineWidth=2;cx.beginPath();cx.arc(bx,by,r*2.4,0,PI2);cx.stroke()}}}
  else{const S=Math.min(W,H)*.38;cx.globalAlpha=al;cx.lineWidth=3;cx.strokeStyle='#000';cx.beginPath();cx.arc(o.x,o.y,S,0,PI2);cx.stroke();
   if(now>=o.T){cx.lineWidth=2;cx.beginPath();cx.arc(o.x,o.y,Math.max(1,S*(1-(now-o.T)/(o.E-o.T))),0,PI2);cx.stroke()}
   cx.fillStyle='#000';cx.textAlign='center';cx.font='bold 20px '+F;cx.fillText(now<o.T?'SPIN':(Math.abs(o.rot)/PI2).toFixed(1)+' / '+((o.E-o.T)/1000*1.5).toFixed(0),o.x,o.y+7)}}
 cx.globalAlpha=1;const a=aimAcc();
 return `score ${st.score}  acc ${a.toFixed(2)}%  combo ${st.combo}x  300:${st.j[0]} 100:${st.j[1]} 50:${st.j[2]} miss:${st.j[3]}`}
function aimAcc(){const j=st.j,n=j[0]+j[1]+j[2]+j[3];return n?(300*j[0]+100*j[1]+50*j[2])/(3*n):100}
function aimEnd(){const a=aimAcc(),k='bestAim'+st.bpm+st.pat,b=ls.get(k),nb=st.score>b;if(nb)ls.set(k,st.score);const m=avg(st.errs);
 return `AIM RESULTS @ ${st.bpm} bpm, ${st.pat}${nb?'  (new best!)':''}\n\nscore       ${st.score}   best ${Math.max(b,st.score)}\naccuracy    ${a.toFixed(2)}%\n300 ${st.j[0]}  100 ${st.j[1]}  50 ${st.j[2]}  miss ${st.j[3]}\nmax combo   ${st.maxc}x\nunstable    ${(sd(st.errs)*10).toFixed(0)} UR\nmean error  ${m.toFixed(1)} ms (${m<0?'early':'late'})\noff-center  ${(avg(st.off)*100).toFixed(0)}% of radius\nslider hold ${st.track.length?(avg(st.track)*100).toFixed(0)+'%':'-'}\nspinner     ${st.spins.length?avg(st.spins).toFixed(0)+' rpm':'-'}\nmisclicks   ${st.mis}\n`}
// ---------- mania ----------
const KEYS='dfjk',MW=[[40,300],[80,200],[110,100],[140,50]],MISS=160,LW=70,JN=['300','200','100','50','miss','released early'];
function mjudge(i,err){adapt(i<2);st.j[i]++;if(i<4){st.combo++;st.maxc=Math.max(st.maxc,st.combo);st.errs.push(err);hitSound()}else st.combo=0;st.last={i,err,t:performance.now()}}
function mpress(l,now){let best=null;for(const n of st.notes)if(n.l==l&&!n.done&&!n.hit&&Math.abs(now-n.t)<=MISS&&(!best||n.t<best.t))best=n;
 if(!best)return;const e=now-best.t,a=Math.abs(e),i=a>MW[3][0]?4:MW.findIndex(w=>a<=w[0]);mjudge(i,e);
 if(best.e&&i<4){best.hit=1;st.hold[l]=best}else{best.done=1;if(best.e)st.ht[1]++}}
function holdEnd(n,ok){st.hold[n.l]=null;if(ok){st.ht[0]++;st.combo++;st.maxc=Math.max(st.maxc,st.combo)}else{st.ht[1]++;st.combo=0;st.last={i:5,err:0,t:performance.now()}}}
function mAcc(){const j=st.j,n=j.reduce((a,b)=>a+b,0);return n?(j[0]*300+j[1]*200+j[2]*100+j[3]*50)/(n*3):100}
function maniaDraw(now){const lx=W/2-LW*2,hy=H-110,px=st.spd,u=st.bl/st.snap;
 while(st.next<now+H/px&&(!st.dur||st.next<st.dur-300)){const T=st.next;st.next+=u;if(Math.random()<.2+(1-st.dens))continue;
  const fr=[0,1,2,3].filter(i=>st.busy[i]<T);if(!fr.length)continue;let l;do l=fr[Math.random()*fr.length|0];while(l==st.lastLane&&fr.length>1&&Math.random()<.7);st.lastLane=l;
  const nt={l,t:T};if(Math.random()<.15&&(!st.dur||T+st.bl*2<st.dur)){nt.e=T+st.bl*(1+(Math.random()*2|0))*(Math.random()<.5?.5:1);st.busy[l]=nt.e+u*.5}else st.busy[l]=T;st.notes.push(nt);
  const f2=fr.filter(i=>i!=l);if(T%st.bl<1&&f2.length&&Math.random()<.2){const l2=f2[Math.random()*f2.length|0];st.busy[l2]=T;st.notes.push({l:l2,t:T})}}
 for(const n of st.notes){if(n.hit){if(now>=n.e){n.done=1;holdEnd(n,1)}}else if(!n.done&&now-n.t>MISS){n.done=1;mjudge(4,MISS);if(n.e)st.ht[1]++}}
 st.notes=st.notes.filter(n=>!n.done);
 cx.strokeStyle='#000';cx.lineWidth=2;
 for(let i=0;i<=4;i++){cx.beginPath();cx.moveTo(lx+i*LW,0);cx.lineTo(lx+i*LW,H);cx.stroke()}
 for(let b=Math.ceil(now/st.bl)*st.bl;b<now+H/px;b+=st.bl){const y=hy-(b-now)*px;cx.globalAlpha=.15;cx.fillStyle='#000';cx.fillRect(lx,y,LW*4,1);cx.globalAlpha=1}
 cx.textAlign='center';
 for(let i=0;i<4;i++){const on=st.held[i];cx.fillStyle=on?'#000':'#fff';cx.fillRect(lx+i*LW+6,hy+6,LW-12,30);cx.strokeRect(lx+i*LW+6,hy+6,LW-12,30);
  cx.fillStyle=on?'#fff':'#000';cx.fillText(KEYS[i].toUpperCase(),lx+i*LW+LW/2,hy+25)}
 cx.lineWidth=4;cx.beginPath();cx.moveTo(lx,hy);cx.lineTo(lx+4*LW,hy);cx.stroke();
 for(const n of st.notes){let y=hy-(n.t-now)*px;const X=lx+n.l*LW;if(n.e){const ye=hy-(n.e-now)*px;if(n.hit)y=hy;if(y>-20){cx.fillStyle=n.hit?'#ddd':'#fff';cx.lineWidth=2;cx.fillRect(X+14,ye,LW-28,y-ye);cx.strokeRect(X+14,ye,LW-28,y-ye);cx.fillStyle='#000';cx.fillRect(X+4,ye-4,LW-8,5)}}
  cx.fillStyle='#000';if(y>-20)cx.fillRect(X+4,y-10,LW-8,14)}
 const L=st.last;if(L&&performance.now()-L.t<400){cx.font='bold 22px '+F;cx.globalAlpha=1-(performance.now()-L.t)/400;
  cx.fillText(JN[L.i]+(L.i>0&&L.i<4?(L.err<0?' early':' late'):''),W/2,hy-160);cx.globalAlpha=1;cx.font='14px '+F}
 const bx=W/2,by=hy+60;cx.fillRect(bx-MISS,by,MISS*2,1);cx.fillRect(bx-1,by-8,2,16);
 for(const e of st.errs.slice(-30))cx.fillRect(bx+e-1,by-6,2,12);
 return `acc ${mAcc().toFixed(2)}%  combo ${st.combo}  ${JN.slice(0,5).map((n,i)=>n+':'+st.j[i]).join(' ')}  UR ${(sd(st.errs)*10).toFixed(0)}`}
function maniaEnd(el){const a=mAcc(),k=`bestMania${st.bpm}_${st.snap}`,b=ls.get(k),hits=st.j[0]+st.j[1]+st.j[2]+st.j[3],nb=hits>20&&a*100>b;if(nb)ls.set(k,Math.round(a*100));const m=avg(st.errs);
 return `MANIA RESULTS @ ${st.bpm} bpm 1/${st.snap}${nb?'  (new best!)':''}\n\naccuracy   ${a.toFixed(2)}%   best ${(Math.max(b,nb?a*100:0)/100).toFixed(2)}%\n300 ${st.j[0]}  200 ${st.j[1]}  100 ${st.j[2]}  50 ${st.j[3]}  miss ${st.j[4]}\nholds      ${st.ht[0]} / ${st.ht[0]+st.ht[1]} held to the end\nmax combo  ${st.maxc}\nunstable   ${(sd(st.errs)*10).toFixed(0)} UR\nmean error ${m.toFixed(1)} ms (${m<0?'early':'late'})\nduration   ${(Math.max(0,el)/1000).toFixed(0)}s\n`}
// ---------- taiko ----------
const TW=[35,80],TMISS=110,TP={alt:['dkdk','kdkd'],tri:['ddk','kkd','dkk','kdd'],burst:['ddddd','kkkkk','dkdkd','ddkdd','kdddk'],fc:['kddkdd','dkkdkk','kkdkkd','ddkkdd'],stream:['dkdkddkdkk','ddkkddkd','kdddkkdk'],mono:['dddd','kkkk','ddddddd','kkkkkk']};
function tgen(now){const q=st.bl/4;while(st.next<now+W/st.spd&&(!st.dur||st.next<st.dur-300)){
 if(Math.random()<.1*st.dens&&(!st.dur||st.next+st.bl*3<st.dur)){const len=st.bl*(1+(Math.random()*2|0));st.notes.push({t:st.next,e:st.next+len,roll:1});st.rollMs+=len;st.next+=len+st.bl;continue}
 const P=st.tpat=='mix'?Object.keys(TP)[Math.random()*6|0]:st.tpat,list=TP[P],str=list[Math.random()*list.length|0],
 step=(P=='burst'||P=='stream')?q:q*2;
 if(Math.random()>st.dens){st.next+=st.bl;continue}for(const ch of str){st.notes.push({t:st.next,k:ch=='k'?1:0});st.next+=step}
 st.next=Math.ceil((st.next+st.bl/2)/(st.bl/2))*(st.bl/2)}}
function tjudge(n,i,e){adapt(i==0);st.j[i]++;if(n)st.typ[n.k][i<2?0:1]++;if(i<2){st.combo++;st.maxc=Math.max(st.maxc,st.combo);st.errs.push(e);hitSound()}else st.combo=0;st.last={i,t:performance.now()}}
function tpress(k,now){const rl=st.notes.find(m=>m.roll&&now>=m.t-30&&now<=m.e);if(rl){st.rolls++;hitSound();st.last={i:3,t:performance.now()};return}
 let n=null;for(const m of st.notes)if(!m.done&&!m.roll&&Math.abs(now-m.t)<=TMISS&&(!n||m.t<n.t))n=m;if(!n)return;
 n.done=1;const e=now-n.t,a=Math.abs(e);tjudge(n,n.k!=k?2:a<=TW[0]?0:a<=TW[1]?1:2,e)}
function tAcc(){const j=st.j,n=j[0]+j[1]+j[2];return n?(j[0]+j[1]*.5)/n*100:100}
function taikoDraw(now){tgen(now);const hx=Math.min(160,W*.2),y=H/2,R0=26;
 for(const n of st.notes)if(!n.done&&(n.roll?now>n.e:now-n.t>TMISS)){n.done=1;if(!n.roll)tjudge(n,2,TMISS)}st.notes=st.notes.filter(n=>!n.done);
 cx.strokeStyle='#000';cx.lineWidth=2;cx.strokeRect(-2,y-50,W+4,100);
 for(let b=Math.ceil(now/st.bl)*st.bl;b<now+W/st.spd;b+=st.bl){const x=hx+(b-now)*st.spd;cx.globalAlpha=.15;cx.fillStyle='#000';cx.fillRect(x,y-50,1,100);cx.globalAlpha=1}
 cx.lineWidth=3;cx.beginPath();cx.arc(hx,y,R0+6,0,PI2);cx.stroke();
 const dn=st.held[1]||st.held[2],kt=st.held[0]||st.held[3];if(dn){cx.globalAlpha=.25;cx.fillStyle='#000';cx.beginPath();cx.arc(hx,y,R0+6,0,PI2);cx.fill();cx.globalAlpha=1}
 if(kt){cx.lineWidth=6;cx.beginPath();cx.arc(hx,y,R0+14,0,PI2);cx.stroke()}
 for(let i=st.notes.length-1;i>=0;i--){const n=st.notes[i],x=hx+(n.t-now)*st.spd;if(x>W+40)continue;if(n.roll){const xe=hx+(n.e-now)*st.spd,xs=Math.max(x,hx),hh=R0*.8;cx.fillStyle='#fff';cx.lineWidth=3;cx.beginPath();cx.arc(xs,y,hh,Math.PI/2,Math.PI*1.5);cx.lineTo(xe,y-hh);cx.arc(xe,y,hh,-Math.PI/2,Math.PI/2);cx.closePath();cx.fill();cx.stroke();
   cx.fillStyle='#000';for(let d=xs+10;d<xe;d+=16){cx.beginPath();cx.arc(d,y,3,0,PI2);cx.fill()}continue}
  cx.beginPath();cx.arc(x,y,R0,0,PI2);
  if(n.k){cx.fillStyle='#fff';cx.fill();cx.lineWidth=7;cx.stroke()}else{cx.fillStyle='#000';cx.fill()}}
 const L=st.last;cx.textAlign='center';if(L&&performance.now()-L.t<400){cx.font='bold 22px '+F;cx.fillStyle='#000';cx.globalAlpha=1-(performance.now()-L.t)/400;cx.fillText(['great','ok','miss','roll!'][L.i],hx,y-70);cx.globalAlpha=1;cx.font='14px '+F}
 const bx=W/2,by=y+90;cx.fillStyle='#000';cx.fillRect(bx-TMISS,by,TMISS*2,1);cx.fillRect(bx-1,by-8,2,16);for(const e of st.errs.slice(-30))cx.fillRect(bx+e-1,by-6,2,12);
 return `acc ${tAcc().toFixed(2)}%  combo ${st.combo}  great:${st.j[0]} ok:${st.j[1]} miss:${st.j[2]}  UR ${(sd(st.errs)*10).toFixed(0)}`}
function taikoEnd(el){const a=tAcc(),k=`bestTaiko${st.bpm}${st.tpat}`,b=ls.get(k),nb=st.j[0]+st.j[1]>20&&a*100>b;if(nb)ls.set(k,Math.round(a*100));const m=avg(st.errs),pc=t=>t[0]+t[1]?(t[0]/(t[0]+t[1])*100).toFixed(1)+'%':'-';
 return `TAIKO RESULTS @ ${st.bpm} bpm, ${st.tpat}${nb?'  (new best!)':''}\n\naccuracy   ${a.toFixed(2)}%   best ${(Math.max(b,nb?a*100:0)/100).toFixed(2)}%\ngreat ${st.j[0]}  ok ${st.j[1]}  miss ${st.j[2]}\ndon hit    ${pc(st.typ[0])}   kat hit ${pc(st.typ[1])}\ndrumroll   ${st.rolls} hits${st.rollMs?` (${(st.rolls/(st.rollMs/1000)).toFixed(1)}/s)`:''}\nmax combo  ${st.maxc}\nunstable   ${(sd(st.errs)*10).toFixed(0)} UR\nmean error ${m.toFixed(1)} ms (${m<0?'early':'late'})\nduration   ${(Math.max(0,el)/1000).toFixed(0)}s\n`}
// ---------- shared ----------
const songNow=()=>performance.now()-st.start;
function end(){const el=songNow(),ad=st.ad?`adaptive level reached ${st.lmax}, ended at ${st.lvl}\n`:'',r=ad+(st.m=='aim'?aimEnd():st.m=='taiko'?taikoEnd(el):maniaEnd(el));st=null;cx.clearRect(0,0,W,H);hud.textContent='';show(r)}
onmousemove=e=>{if(st&&st.m=='aim'){st.mx=e.clientX;st.my=e.clientY;if(st.trail)st.tr.push([e.clientX,e.clientY,performance.now()])}};
c.onmousedown=e=>{e.preventDefault();if(st&&st.m=='aim')press(songNow())};
onmouseup=()=>{if(st&&st.m=='aim')st.down=Math.max(0,st.down-1)};
onkeydown=e=>{if(e.repeat)return;const k=e.key.toLowerCase();
 if(!st){if(k==' '&&document.activeElement.tagName!='BUTTON'){e.preventDefault();start()}return}
 if(k=='escape')return end();
 if(st.m=='aim'&&(k=='z'||k=='x'))press(songNow());
 if(st.m=='mania'){const l=KEYS.indexOf(k);if(l>=0){st.held[l]=1;mpress(l,songNow())}}
 if(st.m=='taiko'){const l=KEYS.indexOf(k);if(l>=0){st.held[l]=1;tpress(l==0||l==3?1:0,songNow())}}};
onkeyup=e=>{if(!st)return;const k=e.key.toLowerCase();
 if(st.m=='aim'&&(k=='z'||k=='x'))st.down=Math.max(0,st.down-1);
 if(st.m!='aim'){const l=KEYS.indexOf(k);if(l>=0){st.held[l]=0;if(st.m=='mania'&&st.hold[l]){const n=st.hold[l],t=songNow();n.done=1;holdEnd(n,t>=n.e-MISS)}}}};
oncontextmenu=e=>e.preventDefault();
function loop(){requestAnimationFrame(loop);if(!st)return;cx.clearRect(0,0,W,H);cx.font='14px '+F;
 const now=songNow();if(st.dur&&now>=st.dur+(st.m=='aim'?200:MISS))return end();sched(now);
 const h=st.m=='aim'?aimDraw(now):st.m=='taiko'?taikoDraw(now):maniaDraw(now);
 cx.globalAlpha=1;cx.textAlign='center';cx.fillStyle='#000';
 if(now<0){cx.font='bold 40px '+F;cx.fillText(Math.ceil(-now/st.bl),W/2,80);cx.font='14px '+F}
 if(st.pops)for(const p of st.pops=st.pops.filter(p=>performance.now()-p.t<600)){const a=(performance.now()-p.t)/600;cx.globalAlpha=1-a;cx.font='bold 18px '+F;cx.fillText(p.v?p.v:'×',p.x,p.y-(st.r||0)-8-a*14)}
 if(st.trail&&st.m=='aim'){const T0=performance.now();st.tr=st.tr.filter(p=>T0-p[2]<180);cx.strokeStyle='#000';cx.lineCap='round';
  for(let i=1;i<st.tr.length;i++){const a=st.tr[i-1],b=st.tr[i];cx.globalAlpha=.6*(1-(T0-b[2])/180);cx.lineWidth=2+4*(1-(T0-b[2])/180);cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke()}}
 cx.globalAlpha=1;cx.font='14px '+F;
 hud.textContent=(st.dur?`time ${Math.max(0,(st.dur-Math.max(now,0))/1000).toFixed(1)}`:`time ${(Math.max(now,0)/1000).toFixed(0)}s (esc to stop)`)+`  ${st.bpm}bpm  `+(st.ad?`lvl ${st.lvl}  `:'')+h}
requestAnimationFrame(loop);
show(`AIMTRAIN\n\nosu-style aim, mania and taiko trainer, synced to a beat\n`);
</script>
