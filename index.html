<title>Aimtrain</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* white ground, black ink (requested); grey for secondary text, in the spirit of a minimal typing-test UI */
:root{--bg:#fff;--fg:#111;--sub:#9a9a9a;--tint:#f1f1f1;color-scheme:light}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow:hidden;user-select:none}
canvas{display:block;cursor:crosshair}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));pointer-events:none;white-space:pre;font-variant-numeric:tabular-nums}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;gap:24px;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;overflow:auto;background:var(--bg)}
#menu[hidden]{display:none}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;max-width:1000px;width:100%;margin:0 auto}
.logo{font-size:26px;font-weight:700;letter-spacing:-.02em}.logo span{color:var(--sub)}
.opt,.links button,.start{background:none;border:0;color:var(--sub);padding:3px 6px;cursor:pointer;font:inherit;border-radius:4px}
.opt:hover,.links button:hover,.start:hover{color:var(--fg)}
.opt.on{color:var(--fg);font-weight:700}
#cfg{align-self:center;background:var(--tint);border-radius:8px;padding:8px 14px;display:flex;flex-direction:column;gap:6px;max-width:100%;box-sizing:border-box}
.line{display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:center}
.grp{display:flex;align-items:center;flex-wrap:wrap}
.grp small{color:var(--sub);margin-right:4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.tabs .opt{font-size:17px}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:max-content}
#big{display:flex;gap:44px;flex-wrap:wrap;justify-content:center}
.stat small{display:block;color:var(--sub);font-size:16px}.stat b{font-size:52px;line-height:1.05;font-variant-numeric:tabular-nums}
#res{margin:0;white-space:pre;line-height:1.6;max-width:100%;overflow:auto;font:inherit;font-variant-numeric:tabular-nums}
#help{color:var(--sub);margin:0;font:inherit;white-space:pre-wrap;text-align:center;line-height:1.6}
.start{font-size:18px;color:var(--fg)}
footer{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;color:var(--sub);font-size:12px}
kbd{background:var(--tint);color:var(--fg);border-radius:4px;padding:1px 6px;font:inherit}
#panel{display:grid;gap:12px;background:var(--tint);border-radius:8px;padding:18px 22px;max-width:100%;box-sizing:border-box}
#panel[hidden]{display:none}
#panel label{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
#panel label>span:first-child{color:var(--sub)}
#panel small{color:var(--sub)}.prow{display:flex;gap:8px;justify-content:flex-end}
input,select.dd,#panel select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid #d4d4d4;border-radius:4px;padding:3px 6px}
input{width:5.5em}.wins{display:flex;gap:6px;align-items:center;color:var(--sub);flex-wrap:wrap}
select.dd{color:var(--fg);font-weight:700;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
</style>

<div id="menu">
<header class="top"><div class="logo">aim<span>train</span></div><nav class="links"><button id="setb" data-t="settings">settings</button><button id="keys" data-t="keybinds">keybinds</button><button id="recs" data-t="records">records</button><button id="clr" data-t="clear records">clear records</button></nav></header>

alue="mono">mono don/kat runs</option></select><select id="cpat"><option value="mix">mixed</option><option value="walk">walk jumps</option><option value="dash">dash jumps</option><option value="juice">juice streams</option><option value="zig">zigzags</option></select><select id="opat"><option value="mixed">mixed</option><option value="straight">straight</option><option value="square">90° turns</option><option value="zigzag">zigzag</option><option value="thirds">thirds (60° / 120°)</option><option value="swing">swing (0.75 / 1.25)</option></select><select id="msnap"><option value="1">1/1</option><option value="2" selected>1/2</option><option value="4">1/4</option></select><select id="spd"><option value="0.8">slow</option><option value="1.2" selected>normal</option><option value="1.8">fast</option></select></div>
</div>

let ac,master,nb;

function tone(t,f,d,type,g,f2){const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(master);o.start(t);o.stop(t+d+.02)}
function noise(t,d,g,hp){if(!nb){nb=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const s=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=hp;
 v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(v);v.connect(master);s.start(t);s.stop(t+d+.02)}
const PROG=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],mf=n=>440*2**((n-69)/12);
function beat(b,t,bl){if(b<0){tone(t,b==-4?1320:880,.06,'square',.12);return}
 const ch=PROG[(b>>2)%4];tone(t,150,.3,'sine',.9,40);noise(t+bl/2,.05,.22,7000);if(b%2)noise(t,.12,.18,2500);
 tone(t,mf(ch[0]-12),bl*.9,'triangle',.4);tone(t+bl/2,mf(ch[0]-12),bl*.4,'triangle',.25);
 tone(t,mf(ch[b%3]+12),bl*.45,'square',.035);tone(t+bl/2,mf(ch[(b+1)%3]+12),bl*.45,'square',.03)}
function hitSound(){if(OPT.hs&&ac&&master.gain.value)noise(ac.currentTime,.03,.5,3000)}
function sched(now){if(!ac||!master.gain.value)return;while(st.ab*st.bl<now+200){const tt=st.ab*st.bl;if(tt>now-30)beat(st.ab,ac.currentTime+Math.max(0,(tt-now)/1000),st.bl/1000);st.ab++}}

 r.pb=pb==null||v>pb;h.push(r);try{localStorage.hist=JSON.stringify(h.slice(-500))}catch(e){}
 if(pb==null)return `\nRECORD CHECK  first run on ${r.m} ${r.cfg}, saved as your record\n`;
 const d=v-pb;return `\nRECORD CHECK  ${r.m} ${r.cfg}\nrecord      ${fmt(r,pb)}\nthis run    ${fmt(r,v)}  (${d>=0?'+':''}${r.m=='aim'?Math.round(d):d.toFixed(2)+'%'})\n${r.pb?'NEW RECORD':'no record this time ('+prev.length+' earlier runs)'}\n`}
function records(){const h=hist();if(!h.length)return show('RECORDS\n\nno runs yet. finish a round (10+ notes) to save one.\n');const g={};for(const r of h){const k=r.m+' '+r.cfg;(g[k]=g[k]||[]).push(r)}
 let s='RECORDS\n\n'+'mode / bpm / settings'.padEnd(32)+'record    UR    runs  last\n';
 for(const k of Object.keys(g).sort()){const a=g[k],b=a.reduce((p,r)=>runVal(r)>runVal(p)?r:p);s+=k.padEnd(32)+fmt(b,runVal(b)).padEnd(10)+String(b.ur).padEnd(6)+String(a.length).padEnd(6)+fmt(a[a.length-1],runVal(a[a.length-1]))+'\n'}
 s+='\nRECENT RUNS\n';for(const r of h.slice(-12).reverse())s+=new Date(r.t).toLocaleString().padEnd(24)+(r.m+' '+r.cfg).padEnd(30)+(r.m=='aim'?r.score+' pts  ':'')+r.acc.toFixed(2)+'%  UR '+r.ur+(r.pb?'  * record':'')+'\n';
 show(s)}
$('recs').onclick=records;
$('clr').onclick=()=>{const b=$('clr');if(b.dataset.arm){try{localStorage.removeItem('hist')}catch(e){}b.textContent='clear records';delete b.dataset.arm;show('RECORDS\n\nrecords cleared\n')}else{b.dataset.arm=1;b.textContent=tr('click again to clear');setTimeout(()=>{b.textContent=tr('clear records');delete b.dataset.arm},3000)}};
// ---------- shared ----------
const songNow=()=>performance.now()-st.start-OPT.off;
function end(){const el=songNow(),ad=st.ad?`adaptive level reached ${st.lmax}, ended at ${st.lvl}\n`:'',M=st.m,r=ad+(M=='aim'?aimEnd():M=='taiko'?taikoEnd(el):M=='orbit'?orbitEnd(el):M=='catch'?catchEnd(el):maniaEnd(el)),
 acc=M=='aim'?aimAcc():M=='taiko'?tAcc():M=='orbit'?oAcc():M=='catch'?cAcc():mAcc(),n=st.j.reduce((a,b)=>a+b,0),cfg=st.bpm+' '+(M=='aim'?st.pat:M=='taiko'?st.tpat:M=='orbit'?st.opat:M=='catch'?st.cpat:'1/'+st.snap)+(st.ad?' adaptive':''),
 big=[...(M=='aim'?[['score',st.score]]:[]),['acc',acc.toFixed(2)+'%'],...(M=='catch'?[['missed',st.j[1]+st.dj[1]]]:[['UR',Math.round(sd(st.errs)*10)]]),['combo',st.maxc+'x']],rc=n>=10?saveRun({t:Date.now(),m:M,cfg,acc,score:st.score||0,ur:Math.round(sd(st.errs)*10)}):'\n(round too short to save, needs 10+ notes)\n';st=null;cx.clearRect(0,0,W,H);hud.textContent='';show(r+rc,big)}
onmousemove=e=>{if(st&&st.m=='aim'){st.mx=e.clientX;st.my=e.clientY;if(st.trail)st.tr.push([e.clientX,e.clientY,performance.now()])}};
c.onmousedown=e=>{e.preventDefault();if(st&&st.m=='aim')press(songNow());else if(st&&st.m=='orbit')opress(songNow())};
onmouseup=()=>{if(st&&st.m=='aim')st.down=Math.max(0,st.down-1)};
onkeydown=e=>{if(e.repeat)return;const k=e.key.toLowerCase();
 if(!st&&/INPUT|SELECT/.test(document.activeElement.tagName))return;
 if(k=='tab'){e.preventDefault();if(st){st=null;cx.clearRect(0,0,W,H);hud.textContent=''}start();return}
 if(!st){if((k==' '||k=='enter')&&document.activeElement.tagName!='BUTTON'){e.preventDefault();start()}return}
 if(k=='escape')return end();
 if(st.m=='orbit'){opress(songNow());return}
 if(st.m=='catch'){if(k=='arrowleft')st.kl=1;else if(k=='arrowright')st.kr=1;else if(k=='shift')st.dash=1;e.preventDefault();return}
 if(st.m=='aim'&&(k=='z'||k=='x'))press(songNow());
 if(st.m=='mania'){const l=KEYS.indexOf(k);if(l>=0){st.held[l]=1;mpress(l,songNow())}}
 if(st.m=='taiko'){const l=KEYS.indexOf(k);if(l>=0){st.held[l]=1;tpress(l==0||l==3?1:0,songNow())}}};
onkeyup=e=>{if(!st)return;const k=e.key.toLowerCase();
 if(st.m=='catch'){if(k=='arrowleft')st.kl=0;else if(k=='arrowright')st.kr=0;else if(k=='shift')st.dash=0;return}
 if(st.m=='aim'&&(k=='z'||k=='x'))st.down=Math.max(0,st.down-1);
 if(st.m!='aim'){const l=KEYS.indexOf(k);if(l>=0){st.held[l]=0;if(st.m=='mania'&&st.hold[l]){const n=st.hold[l],t=songNow();n.done=1;holdEnd(n,t>=n.e-MISS)}}}};
oncontextmenu=e=>e.preventDefault();
function loop(){requestAnimationFrame(loop);if(!st)return;cx.clearRect(0,0,W,H);cx.font='14px '+F;
 const now=songNow();if(st.dur&&now>=st.dur+(st.m=='aim'?200:MISS))return end();sched(now+OPT.off);
 const h=st.m=='aim'?aimDraw(now):st.m=='taiko'?taikoDraw(now):st.m=='orbit'?orbitDraw(now):st.m=='catch'?catchDraw(now):maniaDraw(now);
 cx.globalAlpha=1;cx.textAlign='center';cx.fillStyle='#000';
 if(now<0){cx.font='bold 40px '+F;cx.fillText(Math.ceil(-now/st.bl),W/2,80);cx.font='14px '+F}
 if(st.pops&&st.m!='orbit')for(const p of st.pops=st.pops.filter(p=>performance.now()-p.t<600)){const a=(performance.now()-p.t)/600;cx.globalAlpha=1-a;cx.font='bold 18px '+F;cx.fillText(p.v?p.v:'×',p.x,p.y-(st.r||0)-8-a*14)}
 if(st.trail&&st.m=='aim'){const T0=performance.now();st.tr=st.tr.filter(p=>T0-p[2]<180);cx.strokeStyle='#000';cx.lineCap='round';
  for(let i=1;i<st.tr.length;i++){const a=st.tr[i-1],b=st.tr[i];cx.globalAlpha=.6*(1-(T0-b[2])/180);cx.lineWidth=2+4*(1-(T0-b[2])/180);cx.beginPath();cx.moveTo(a[0],a[1]);cx.lineTo(b[0],b[1]);cx.stroke()}}
 cx.globalAlpha=1;cx.font='14px '+F;
 hud.textContent=(st.dur?`time ${Math.max(0,(st.dur-Math.max(now,0))/1000).toFixed(1)}`:`time ${(Math.max(now,0)/1000).toFixed(0)}s (esc to stop)`)+`  ${st.bpm}bpm  `+(st.ad?`lvl ${st.lvl}  `:'')+h}
requestAnimationFrame(loop);
L10N.en={INTRO:'osu-style aim, mania, taiko, orbit and catch trainer, synced to a beat\nevery finished round is checked against your records\n'};
loadCfg();applyWin();show(tr('INTRO'));
</script>
